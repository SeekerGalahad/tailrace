[package]
name = "tailrace-decode"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Decoder trait plus ogg/json/csv/parquet decoders writing directly into Arrow columns"
keywords = ["decoder", "json", "csv", "parquet", "ogg"]
categories = ["encoding", "parser-implementations"]

[lints]
workspace = true

[dependencies]
anyhow = "1"
bytes = { workspace = true }
csv = { workspace = true }
datafusion = { workspace = true }
simd-json = { workspace = true }
serde_json = { workspace = true }
# A4 (R9): the variant field marker (`VARIANT_FIELD_METADATA` /
# `is_variant_field`) is part of the column-type wire contract and lives in
# tailrace-ir; the decoders read it to pass nested JSON through as text.
# No cycle: ir does not depend on decode.
tailrace-ir = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "decode"
harness = false
