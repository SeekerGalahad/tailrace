[package]
name = "tailrace-state"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "OffsetStore trait (commit only after write success — the at-least-once anchor) plus the local JSON ledger"
keywords = ["offset", "checkpoint", "ledger", "at-least-once", "cursor"]
