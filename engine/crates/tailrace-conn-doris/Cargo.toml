[package]
name = "tailrace-conn-doris"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Doris sink: BE-direct stream load with idempotent labels, bounded retries, group commit and sequence columns"

[features]
# StarRocks speaks the same Stream Load protocol: enabling this registers the
# extra "starrocks" sink kind on the same factory, which switches to the
# StarRocks flavor (FE redirect following, StarRocks header set — T12).
# Default ON (T12): the console already accepts kind=starrocks
# (console-proxy probe / pipelines / datasources), so a node built without
# it could not assemble a pipeline the console had let through. Registering
# a kind no pipeline references is a no-op; `--no-default-features` still
# builds the Doris-only sink (CI no-default-features guard).
default = ["starrocks"]
starrocks = []

[dependencies]
anyhow = "1"
# T3: refcount-shared request body (`Bytes` clones are free — the old
# `body.to_vec()` copied the whole buffer on every retry attempt)
bytes = { workspace = true }
# T2: engine-wide structured logging (tracing macros with pipeline/statement fields)
tracing = { workspace = true }
serde_json = { workspace = true }
datafusion = { workspace = true }
reqwest = { workspace = true }
tailrace-catalog = { workspace = true }
tailrace-connector = { workspace = true }
