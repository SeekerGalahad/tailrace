[package]
name = "tailrace-conn-doris"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Doris sink: BE-direct stream load with idempotent labels, bounded retries, group commit and sequence columns"

[features]
# StarRocks speaks the same Stream Load protocol: enabling this only registers
# the extra "starrocks" sink kind (same factory). A dedicated default
# user-agent can ride on this feature later — the protocol is shared.
starrocks = []

[dependencies]
anyhow = "1"
# T3: refcount-shared request body (`Bytes` clones are free — the old
# `body.to_vec()` copied the whole buffer on every retry attempt)
bytes = { workspace = true }
# T2: engine-wide structured logging (tracing macros with pipeline/statement fields)
tracing = { workspace = true }
serde_json = { workspace = true }
datafusion = { workspace = true }
reqwest = { workspace = true }
tailrace-catalog = { workspace = true }
tailrace-connector = { workspace = true }
