[package]
name = "tailrace-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "CatalogProvider with three backends: local toml file (standalone), plan body (serve), console REST (managed skeleton)"
keywords = ["catalog", "datasource", "toml", "datafusion", "table"]
categories = ["database"]

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = { workspace = true }
tailrace-ir = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# G2 (R8): the vocabulary tests assert the arrow mapping of re-exported
# ColumnType / arrow_type_or_utf8 — dev-only (the dependency graph already
# carries datafusion transitively via tailrace-ir, so this declares no new
# compilation unit)
datafusion = { workspace = true }
