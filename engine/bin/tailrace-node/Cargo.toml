[package]
name = "tailrace-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "tailrace single-binary node entry: CLI (run / serve / compile) with feature-wired connectors"

[features]
# Connector wiring: default registers kafka/file/doris; mqtt/jdbc/s3 stay
# placeholder crates and register nothing until implemented.
default = ["connector-kafka", "connector-file", "connector-doris"]
connector-kafka = ["dep:tailrace-conn-kafka"]
connector-file  = ["dep:tailrace-conn-file"]
connector-doris = ["dep:tailrace-conn-doris"]
connector-mqtt  = ["dep:tailrace-conn-mqtt"]
connector-jdbc  = ["dep:tailrace-conn-jdbc"]
connector-s3    = ["dep:tailrace-conn-s3"]
# T2 observability: OTLP span export (opentelemetry + tracing-opentelemetry).
# Default OFF (roadmap §四 T2 / §八.2): plain tracing stays the always-on floor;
# enabling this compiles the OTLP layer, activated at runtime by
# OTEL_EXPORTER_OTLP_ENDPOINT.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
# T20 allocator A/B (roadmap §九 T20): swap the Rust global allocator for
# jemalloc. Default OFF: the default artifact must stay byte-identical (no
# allocator change for users who do not opt in). Numbers (throughput + peak
# RSS, default vs jemalloc) live in docs/BENCHMARKS.md §六.
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
anyhow = "1"
# T2: subscriber init in main (env-filter, default info) + the optional OTLP layer
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
# T20: #[global_allocator] behind the `jemalloc` feature only
tikv-jemallocator = { workspace = true, optional = true }
tailrace-connector = { workspace = true }
tailrace-conn-kafka = { workspace = true, optional = true }
tailrace-conn-file = { workspace = true, optional = true }
tailrace-conn-doris = { workspace = true, optional = true }
tailrace-conn-mqtt = { workspace = true, optional = true }
tailrace-conn-jdbc = { workspace = true, optional = true }
tailrace-conn-s3 = { workspace = true, optional = true }
tailrace-runtime = { workspace = true }
tailrace-catalog = { workspace = true }
tailrace-api = { workspace = true }
tailrace-parser = { workspace = true }
# graceful shutdown: the signal thread (SIGINT/SIGTERM → final heartbeat
# beat) builds its own current-thread runtime
tokio = { workspace = true, features = ["signal"] }
# Vendored OpenSSL: curl-sys (via rdkafka curl-static) links OpenSSL, and
# cross-compilation containers have no target-arch OpenSSL. Vendoring makes
# every release target self-contained. Unused as a library on purpose.
openssl = { workspace = true }

[dev-dependencies]
# chaos live-gate probes only (documented-precondition checks; both crates
# are already in the workspace dependency graph)
rdkafka = { workspace = true }
reqwest = { workspace = true }
# chaos live-gate skip notice goes through tracing (T2)
tracing = { workspace = true }
# T11: chaos test boots an ephemeral Kafka+Doris stack via testcontainers
# when TAILRACE_TESTCONTAINERS=1 (CI chaos job); default stays live-gated.
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
