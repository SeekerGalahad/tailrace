[package]
name = "tests-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
# Workspace-internal test suite — never published (T26 ④).
publish = false
description = "In-process /v1 protocol contract tests + deterministic executor main-loop tests (file→file, zero external deps) + sink capability contract (G4)"

[lints]
workspace = true

[dependencies]
anyhow = "1"
base64 = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tailrace-api = { workspace = true }
tailrace-catalog = { workspace = true }
tailrace-connector = { workspace = true }
# The suite exercises the registry default (spawn_node →
# PipelineRegistry::new → default_registry), i.e. it really instantiates
# connectors at runtime. Since T16 the workspace edge carries
# default-features = false, so the file connector this suite's file→file
# plans need must be requested explicitly — otherwise a standalone
# `cargo test -p tests-contract --locked` builds a zero-connector runtime
# and every executor_loop case fails with 源类型未支持：file.
tailrace-runtime = { workspace = true, features = ["connector-file"] }
# Sink capability contract (R7 G4, blueprint §7.7 G4 row): the three
# production sinks' declarations are asserted directly on the concrete
# types (construction only — doris builds no client, kafka's producer
# never contacts the dummy bootstrap, file touches no path). This pulls
# the doris/kafka connector stacks into the test build graph; they are
# workspace members anyway, so `cargo test --workspace` already builds
# them.
tailrace-conn-doris = { workspace = true }
tailrace-conn-file = { workspace = true }
tailrace-conn-kafka = { workspace = true }
# Sink trait signatures speak RecordBatch; already in the build graph via
# tailrace-runtime (datafusion), declaring it adds no build cost.
datafusion = { workspace = true }
