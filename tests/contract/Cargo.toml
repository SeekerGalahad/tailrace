[package]
name = "tests-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
# Workspace-internal test suite — never published (T26 ④).
publish = false
description = "In-process /v1 protocol contract tests + deterministic executor main-loop tests (file→file, zero external deps)"

[dependencies]
anyhow = "1"
base64 = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tailrace-api = { workspace = true }
tailrace-catalog = { workspace = true }
tailrace-connector = { workspace = true }
# The suite exercises the registry default (spawn_node →
# PipelineRegistry::new → default_registry), i.e. it really instantiates
# connectors at runtime. Since T16 the workspace edge carries
# default-features = false, so the file connector this suite's file→file
# plans need must be requested explicitly — otherwise a standalone
# `cargo test -p tests-contract --locked` builds a zero-connector runtime
# and every executor_loop case fails with 源类型未支持：file.
tailrace-runtime = { workspace = true, features = ["connector-file"] }
