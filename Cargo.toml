# tailrace workspace root — single source of truth for shared dependency versions.
# Engine-side versions are carried over verbatim from the original engine
# workspace manifest (pre-extraction location, see the design doc §7.1);
# console-side versions follow design doc §3.1/§五/A3/A4. Crate owners edit
# their own manifest, not this file.
[workspace]
resolver = "2"
members = [
    # engine
    "engine/bin/tailrace-node",
    "engine/crates/tailrace-connector",
    "engine/crates/tailrace-conn-kafka",
    "engine/crates/tailrace-conn-file",
    "engine/crates/tailrace-conn-doris",
    "engine/crates/tailrace-conn-mqtt",
    "engine/crates/tailrace-conn-jdbc",
    "engine/crates/tailrace-conn-s3",
    "engine/crates/tailrace-ir",
    "engine/crates/tailrace-decode",
    "engine/crates/tailrace-transform",
    "engine/crates/tailrace-parser",
    "engine/crates/tailrace-state",
    "engine/crates/tailrace-catalog",
    "engine/crates/tailrace-runtime",
    "engine/crates/tailrace-metadata",
    "engine/crates/tailrace-api",
    # console
    "console/crates/tailrace-console",
    "console/crates/console-store",
    "console/crates/console-auth",
    "console/crates/console-proxy",
    # contract tests (engine H3: the /v1 protocol + executor determinism
    # suite — joins cargo test --workspace via membership)
    "tests/contract",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# ---------------------------------------------------------------------------
# Shared dependency version table (single fact source).
# Engine side: copied from the original engine workspace, do not bump ad hoc.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# engine side (verbatim version table)
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync"] }
rdkafka = { version = "0.39", features = ["cmake-build", "tokio", "curl-static"] }
openssl = { version = "0.10", features = ["vendored"] }
datafusion = "48.0.1"
datafusion-proto = "48.0.1"
bytes = "1"
simd-json = "0.15.1"
# T4 CSV decoder: RFC4180 record grammar (already in-tree via arrow-csv —
# declaring the edge only, no new package enters the lock)
csv = "1.4"
serde_json = "1"
toml = "0.8"
base64 = "0.22"
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "blocking", "json"] }
# console side (design doc §3.1 / §5.1 / A3 / A4)
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
argon2 = { version = "0.6", features = ["rand_core"] }
utoipa = "6"
utoipa-axum = "0.3"
# design doc A4 writes "swagger-ui 10"; the actual crate is utoipa-swagger-ui
# (v10.0.1 — the framework integrations are implicit optional-dep features).
utoipa-swagger-ui = { version = "10", features = ["axum"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
rand = "0.9"
aes-gcm = "0.10"
tower = { version = "0.5", features = ["util"] }
tokio-stream = "0.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# T2 observability: OTLP exporter stack. Feature-gated (`otel` on tailrace-node,
# default off). Version anchoring per roadmap §八.2 (opentelemetry 0.33 /
# tracing-opentelemetry 0.34); http-proto + blocking reqwest client only — the
# engine is fully synchronous, spans are emitted from non-tokio threads.
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "internal-logs"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
# T20 allocator A/B (roadmap §九 T20): jemalloc as the process-wide allocator,
# feature-gated on tailrace-node (`jemalloc`, default OFF — the default build
# keeps the system allocator and its artifact is byte-identical). 0.7 line =
# bundled jemalloc 5.3.1 (tikv-jemalloc-sys 0.7.1); prefixed symbols (`_rjem_`),
# so the C side of the process (rdkafka/openssl) stays on the system malloc.
tikv-jemallocator = "0.7"
# T13 JDBC batch source (roadmap §九): sqlx 0.9 over a dedicated
# current-thread runtime. Subcrates direct (NOT the `sqlx` facade): the
# facade carries an optional `sqlx-sqlite` dep whose libsqlite3-sys range
# (<0.38) clashes with console-store's rusqlite 0.40 (links="sqlite3"
# conflict at resolve time even with the feature off); the mysql/postgres
# subcrates are the exact same code the facade re-exports. NO tls feature —
# rustls/native-tls/aws-lc stay out of the product graph (deny gates ran on
# this exact set). "_"-prefixed runtime feature mirrors the facade's own
# runtime-tokio wiring.
sqlx-core = { version = "0.9", default-features = false, features = ["_rt-tokio", "time", "json", "uuid"] }
sqlx-mysql = { version = "0.9", default-features = false, features = ["time", "json"] }
sqlx-postgres = { version = "0.9", default-features = false, features = ["time", "json", "uuid"] }
# dev-only (roadmap T1 benchmark suite): criterion micro-benches live in
# per-crate benches/ and reference this as a workspace dev-dependency —
# never a runtime dependency.
criterion = "0.8"
# dev-only (roadmap T11): ephemeral docker dependency stack for live tests —
# chaos.rs + conn-kafka liveness spin temporary Kafka (and Doris for chaos)
# via testcontainers in CI; local live-gate semantics stay the default.
# Pairing rule: testcontainers-modules 0.15 pins core 0.27.x; reqwest 0.13
# matches the workspace line (no duplicate). Features: blocking sync runner
# only — daemon over the unix socket needs no bollard TLS (pulling it drags
# rustls + aws-lc-sys, a C toolchain burden); readiness probes that need
# HTTP poll the workspace reqwest instead of the http_wait feature.
testcontainers = { version = "0.27.3", default-features = false, features = ["blocking"] }
# mysql/postgres modules added by roadmap T13: conn-jdbc integration tests
# boot ephemeral MySQL/Postgres under TAILRACE_TESTCONTAINERS=1 — per-test
# tags are pinned to the preheated local images (mysql:8.0, postgres:15).
testcontainers-modules = { version = "0.15", default-features = false, features = ["kafka", "mysql", "postgres", "blocking"] }
# internal crates (path + version, mirrors original engine practice)
tailrace-connector = { path = "engine/crates/tailrace-connector", version = "0.1.0" }
tailrace-conn-kafka = { path = "engine/crates/tailrace-conn-kafka", version = "0.1.0" }
tailrace-conn-file = { path = "engine/crates/tailrace-conn-file", version = "0.1.0" }
tailrace-conn-doris = { path = "engine/crates/tailrace-conn-doris", version = "0.1.0" }
tailrace-conn-mqtt = { path = "engine/crates/tailrace-conn-mqtt", version = "0.1.0" }
tailrace-conn-jdbc = { path = "engine/crates/tailrace-conn-jdbc", version = "0.1.0" }
tailrace-conn-s3 = { path = "engine/crates/tailrace-conn-s3", version = "0.1.0" }
tailrace-ir = { path = "engine/crates/tailrace-ir", version = "0.1.0" }
tailrace-decode = { path = "engine/crates/tailrace-decode", version = "0.1.0" }
tailrace-transform = { path = "engine/crates/tailrace-transform", version = "0.1.0" }
tailrace-parser = { path = "engine/crates/tailrace-parser", version = "0.1.0" }
tailrace-state = { path = "engine/crates/tailrace-state", version = "0.1.0" }
tailrace-catalog = { path = "engine/crates/tailrace-catalog", version = "0.1.0" }
# T16 (roadmap §九): default-features = false so a connector-trimmed
# tailrace-node actually drops the connector crates from its link graph.
# Without it every runtime edge (node AND tailrace-api, which sits in the
# node's graph) re-enables the runtime's own defaults (kafka/file/doris) via
# feature unification, and a `--no-default-features --features
# connector-file,connector-doris` node still links rdkafka/curl/vendored
# OpenSSL — the trim was cosmetic. The node re-enables exactly its own
# connector set through engine/bin/tailrace-node's connector-* features
# (dep:<crate> + tailrace-runtime/<feature>), so the DEFAULT build graph is
# unchanged; tailrace-api never instantiates connectors, while tests/contract
# does exercise default_registry() and therefore re-enables connector-file
# explicitly in its own manifest.
tailrace-runtime = { path = "engine/crates/tailrace-runtime", version = "0.1.0", default-features = false }
tailrace-metadata = { path = "engine/crates/tailrace-metadata", version = "0.1.0" }
tailrace-api = { path = "engine/crates/tailrace-api", version = "0.1.0" }
console-store = { path = "console/crates/console-store", version = "0.1.0" }
console-auth = { path = "console/crates/console-auth", version = "0.1.0" }
console-proxy = { path = "console/crates/console-proxy", version = "0.1.0" }
