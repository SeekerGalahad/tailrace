# CI per design doc §8.3 (three jobs: rust / web / smoke), hardened per
# upgrade plan §3.1 (research-oss ③): rust-cache, pinned cargo-deny-action,
# MSRV job, --no-default-features guard, macOS core-test job, workflow hygiene.
name: ci
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      # rust-embed requires web/dist at compile time; jobs that compile the
      # console without a real web build provide a placeholder instead.
      - run: mkdir -p web/dist && echo '<!doctype html><title>placeholder</title>' > web/dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked       # 含 tests/contract 契约测试
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1   # pinned tag (eng M2)
        with:
          command: check
          command-arguments: advisories bans licenses sources

  msrv:                                            # workspace rust-version = 1.95
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p web/dist && echo '<!doctype html><title>placeholder</title>' > web/dist/index.html
      - run: cargo check --workspace --locked

  no-default-features:                            # feature contract: off must still compile (engine M10 guard)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p web/dist && echo '<!doctype html><title>placeholder</title>' > web/dist/index.html
      - run: cargo check --workspace --locked --no-default-features

  macos:                                           # released platform runs at least the core tests (§3.1)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p tailrace-api -p console-store

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          {
            cache: pnpm,
            node-version: 22,
            cache-dependency-path: web/pnpm-lock.yaml,
          }
      - run: cd web && pnpm install --frozen-lockfile
      - run: cd web && pnpm typecheck && pnpm build

  chaos:                                           # T11: live tests on an ephemeral stack via testcontainers-rs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # opt-in mode of the chaos + conn-kafka live tests: boot temporary
      # Kafka (apache module) and Doris (fe/be 2.1.7) containers from the
      # test itself; the default live-gate semantics stay for local runs
      TAILRACE_TESTCONTAINERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-embed requires web/dist at compile time; jobs that compile the
      # console without a real web build provide a placeholder instead.
      - run: mkdir -p web/dist && echo '<!doctype html><title>placeholder</title>' > web/dist/index.html
      # Doris BE requires vm.max_map_count >= 2000000 on the docker host
      # (runners default to 65530; OrbStack/Docker Desktop set it already)
      - run: sudo sysctl -w vm.max_map_count=2000000
      - run: cargo test --locked -p tailrace-node --test chaos -- --nocapture
      - run: cargo test --locked -p tailrace-conn-kafka kafka_source_live -- --nocapture

  smoke:                                           # 端到端冒烟：起 console+node，跑通 healthz/注册/心跳
    needs: [rust, web]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable       # build.sh needs cargo; runners ship no Rust
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4                # build.sh builds the embedded web bundle
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          {
            cache: pnpm,
            node-version: 22,
            cache-dependency-path: web/pnpm-lock.yaml,
          }
      - run: ./scripts/build.sh
      # Doris BE mmap requirement on runners (same as the chaos job)
      - run: sudo sysctl -w vm.max_map_count=2000000
      # --full: compose Kafka+Doris e2e + poison soak (T11). The soak is
      # shortened to fit the 45-min job budget (build+pull+boot ≈ 20 min);
      # the ≥10-minute acceptance runs locally on OrbStack (default 600s).
      - run: SMOKE_FULL_SOAK_SECS=180 ./scripts/smoke.sh --full
