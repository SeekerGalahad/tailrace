# CI per design doc §8.3 (three jobs: rust / web / smoke), hardened per
# upgrade plan §3.1 (research-oss ③): rust-cache, pinned cargo-deny-action,
# MSRV job, --no-default-features guard, slim-features guard (T16), macOS
# core-test job, workflow hygiene.
name: ci
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      # rust-embed requires web/dist at compile time; jobs that compile the
      # console without a real web build provide a placeholder instead.
      - run: mkdir -p web/dist && echo '<!doctype html><title>placeholder</title>' > web/dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked       # 含 tests/contract 契约测试
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1   # pinned tag (eng M2)
        with:
          command: check
          command-arguments: advisories bans licenses sources

  msrv:                                            # workspace rust-version = 1.95
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p web/dist && echo '<!doctype html><title>placeholder</title>' > web/dist/index.html
      - run: cargo check --workspace --locked

  no-default-features:                            # feature contract: off must still compile (engine M10 guard)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p web/dist && echo '<!doctype html><title>placeholder</title>' > web/dist/index.html
      - run: cargo check --workspace --locked --no-default-features

  slim-features:                                  # T16: the shipped connector-trimmed combo (file+doris, no kafka)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # -p tailrace-node never compiles the console, so no web/dist placeholder
      - run: cargo check --locked -p tailrace-node --no-default-features --features connector-file,connector-doris
      # Graph contract (docs/BENCHMARKS.md §6.2): the trim must drop the kafka
      # stack from the LINK GRAPH, not merely skip register(). Before T16 the
      # runtime's own default features leaked back through the tailrace-api
      # edge and the "trimmed" binary was 48 bytes smaller than the default —
      # `cargo check` alone cannot see that regression, `cargo tree` can.
      - run: |
          cargo tree --locked -p tailrace-node --no-default-features --features connector-file,connector-doris -e normal --prefix none > slim-tree.txt
          if grep -E '^(rdkafka|rdkafka-sys|tailrace-conn-kafka|openssl|openssl-sys|curl-sys) ' slim-tree.txt; then
            echo "::error::kafka/curl/openssl stack leaked back into the connector-file,connector-doris graph"
            exit 1
          fi

  macos:                                           # released platform runs at least the core tests (§3.1)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p tailrace-api -p console-store

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          {
            cache: pnpm,
            node-version: 22,
            cache-dependency-path: web/pnpm-lock.yaml,
          }
      - run: cd web && pnpm install --frozen-lockfile
      - run: cd web && pnpm typecheck && pnpm build

  chaos:                                           # T11: live tests on an ephemeral stack via testcontainers-rs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # opt-in mode of the chaos + conn-kafka + conn-jdbc live tests: boot
      # temporary Kafka (apache module), Doris (fe/be 2.1.7), MySQL 8.0 and
      # Postgres 15 containers from the test itself; the default live-gate
      # semantics stay for local runs
      TAILRACE_TESTCONTAINERS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-embed requires web/dist at compile time; jobs that compile the
      # console without a real web build provide a placeholder instead.
      - run: mkdir -p web/dist && echo '<!doctype html><title>placeholder</title>' > web/dist/index.html
      # Doris BE requires vm.max_map_count >= 2000000 on the docker host
      # (runners default to 65530; OrbStack/Docker Desktop set it already)
      - run: sudo sysctl -w vm.max_map_count=2000000
      # ...and no active swap: start_be.sh exit(1)s when the host has swap,
      # and the image entrypoint launders that into a silent container
      # exit(0) (runners ship a default 4096MB swapfile on /mnt — T11 F11)
      - run: sudo swapoff -a
      - run: cargo test --locked -p tailrace-node --test chaos -- --nocapture --include-ignored
      # `kafka_source` prefix matches BOTH live tests (kafka_source_live and
      # kafka_source_discovers_new_partitions_without_reopen) — the old
      # `kafka_source_live` filter never ran the discovery test (T25 trap)
      - run: cargo test --locked -p tailrace-conn-kafka kafka_source -- --nocapture --include-ignored
      # T13 JDBC batch source against real mysql:8.0 / postgres:15 (the
      # `rust` job's workspace run counts these as ignored — only this job
      # gives real-database coverage)
      - run: cargo test --locked -p tailrace-conn-jdbc --test jdbc_sources -- --nocapture --include-ignored

  smoke:                                           # 端到端冒烟：起 console+node，跑通 healthz/注册/心跳
    needs: [rust, web]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable       # build.sh needs cargo; runners ship no Rust
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4                # build.sh builds the embedded web bundle
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          {
            cache: pnpm,
            node-version: 22,
            cache-dependency-path: web/pnpm-lock.yaml,
          }
      - run: ./scripts/build.sh
      # Doris BE mmap requirement on runners (same as the chaos job), plus
      # swapoff — start_be.sh refuses to start on a host with swap, which
      # the entrypoint turns into an undiagnosable exit(0) (T11 F11)
      - run: sudo sysctl -w vm.max_map_count=2000000 && sudo swapoff -a
      # --full: compose Kafka+Doris e2e + poison soak (T11). The soak is
      # shortened to fit the 45-min job budget (build+pull+boot ≈ 20 min);
      # the ≥10-minute acceptance runs locally on OrbStack (default 600s).
      - run: SMOKE_FULL_SOAK_SECS=180 ./scripts/smoke.sh --full
