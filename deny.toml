# cargo-deny gates: licenses + advisories + duplicate deps (design doc §8.1/§8.4).
[graph]
all-features = true

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    # option-ext 0.2.0 (MPL-2.0) via rust-embed -> dirs-sys; weak copyleft,
    # commonly allowlisted in Apache-2.0 projects (upgrade plan §2.2 eng H1).
    "MPL-2.0",
    # T33 (DF 55): libbz2-rs-sys 0.2.5 — the pure-Rust bzip2 that replaces
    # the C libbz2/xz2 stack in DF 55's async-compression dependency face
    # (bzip2 0.6.1 -> compression-codecs). bzip2-1.0.6 is the standard
    # permissive bzip2/libbzip2 license (BSD-style redistribution terms,
    # SPDX-listed) — same family as the BSD-2/3 entries above.
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
# Re-tightened 2026-10-23 (roadmap §九 T39 ⑦ / §八.1 closed): the only yanked
# crate in the graph was zip 8.6.0, a build-dep of utoipa-swagger-ui 10.0.1
# (^8.6, no other 8.x). utoipa-swagger-ui 10.0.2 (2026-10-20) moved to zip
# ^9.0, so the lock now resolves zip 9.0.5 and nothing yanked remains.
yanked = "deny"
ignore = [
    # (T33, DF 48→55): the RUSTSEC-2024-0436 ignore (paste 1.0.15
    # unmaintained, transitive via datafusion-common 48) was dropped with the
    # DataFusion 55.2.0 upgrade — DF 55 no longer depends on paste, the crate
    # left the lockfile (cargo update output: "Removing paste v1.0.15"), and
    # cargo-deny confirmed "advisory was not encountered" while the ignore
    # was still listed.
    # (The three zip <9 extraction advisories that were ignored here while
    # utoipa-swagger-ui pinned zip ^8.6 were dropped 2026-10-23 with the
    # 10.0.2 → zip 9.0.5 upgrade — see roadmap §八.1.)
]
