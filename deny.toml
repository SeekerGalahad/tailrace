# cargo-deny gates: licenses + advisories + duplicate deps (design doc §8.1/§8.4).
[graph]
all-features = true

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    # option-ext 0.2.0 (MPL-2.0) via rust-embed -> dirs-sys; weak copyleft,
    # commonly allowlisted in Apache-2.0 projects (upgrade plan §2.2 eng H1).
    "MPL-2.0",
    # T33 (DF 55): libbz2-rs-sys 0.2.5 — the pure-Rust bzip2 that replaces
    # the C libbz2/xz2 stack in DF 55's async-compression dependency face
    # (bzip2 0.6.1 -> compression-codecs). bzip2-1.0.6 is the standard
    # permissive bzip2/libbzip2 license (BSD-style redistribution terms,
    # SPDX-listed) — same family as the BSD-2/3 entries above.
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
# Re-tightened 2026-10-23 (roadmap §九 T39 ⑦ / §八.1 closed): the only yanked
# crate in the graph was zip 8.6.0, a build-dep of utoipa-swagger-ui 10.0.1
# (^8.6, no other 8.x). utoipa-swagger-ui 10.0.2 (2026-10-20) moved to zip
# ^9.0, so the lock now resolves zip 9.0.5 and nothing yanked remains.
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0391: zstd stream context data leak (transitive via
    # parquet→datafusion). Affects stream encoders/decoders reused across
    # contexts — tailrace only uses block-level parquet compression, never
    # reuses zstd stream contexts.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
    # RUSTSEC-2026-0410 (zstd-sys build-time leak) no longer matches: the
    # 1.2.0 R8 round already took zstd-sys to 2.1.2, and the entry only
    # survived as a stale ignore (deny reported advisory-not-detected).
    # Dropped in the R12 gate round.
    # RUSTSEC-2026-0440: astral-tokio-tar is unmaintained (Astral ended
    # maintenance 2026-11-03). It reaches us only as a dev-dependency of
    # testcontainers (0.27 and 0.28 both pin ^0.6), i.e. the ephemeral
    # docker stack in CI live tests — no product binary links it. Astral's
    # suggested replacement is tar-codec, which testcontainers does not use;
    # there is no upgrade path until upstream swaps the crate. Re-check when
    # testcontainers bumps its tar edge.
    "RUSTSEC-2026-0440",
    # RUSTSEC-2026-0543 / -0555 / -0542: chrono, chrono-tz and humantime are
    # unmaintained (chronotope/chrono#1768, announced 2026-11; humantime
    # only because it wraps chrono). All versions affected, "no safe
    # upgrade is available" — they reach us transitively via
    # datafusion→arrow-array (chrono/chrono-tz) and
    # datafusion→object_store (humantime), so removing them means leaving
    # the datafusion face, not a version bump. Alternatives (jiff/time)
    # need upstream DF adoption first. Re-check when datafusion migrates.
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
    "RUSTSEC-2026-0542",
]
