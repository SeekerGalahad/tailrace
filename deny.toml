# cargo-deny gates: licenses + advisories + duplicate deps (design doc §8.1/§8.4).
[graph]
all-features = true

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    # option-ext 0.2.0 (MPL-2.0) via rust-embed -> dirs-sys; weak copyleft,
    # commonly allowlisted in Apache-2.0 projects (upgrade plan §2.2 eng H1).
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
# zip 8.6.0 (build-dep of utoipa-swagger-ui 10.0.1, the latest release) was
# yanked upstream after 2026-10-13 with no compatible replacement (^8.6 has no
# other version; zip jumped to 9.x). Downgrade to deny once utoipa-swagger-ui
# ships a release off the yanked zip.
yanked = "warn"
ignore = [
    # RUSTSEC-2024-0436: paste 1.0.15 is unmaintained; no safe upgrade exists.
    # Transitive via datafusion-common 48.0.1 (workspace pins datafusion 48,
    # engine version table is not bumped ad hoc). Revisit when datafusion
    # drops paste (upgrade plan §2.2 eng H1 / §3.2; Arroyo/RisingWave do the
    # same for this advisory).
    "RUSTSEC-2024-0436",
]
