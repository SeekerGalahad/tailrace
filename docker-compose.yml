# tailrace smoke --full dependencies (design doc §十 P1 acceptance):
# a single-node Kafka (KRaft, no zookeeper) + a single-node Doris (FE+BE).
#
# NOT started by scripts/smoke.sh unless --full is passed. Engine consumes
# Kafka on 127.0.0.1:9092 (bootstrap) and Doris Stream Load on 127.0.0.1:38040
# (BE webserver_port, host side); MySQL protocol for DDL/queries on
# 127.0.0.1:39030 (FE, host side; container-side stays 9030/8040).
#
# Kafka runs the official apache/kafka image (bitnami/kafka was removed from
# Docker Hub — the 2025 Bitnami archive — T11 first-run finding F1). Env vars
# follow the apache/kafka KAFKA_* -> server.properties convention.
#
# Doris runs the multi-arch fe-2.1.7 / be-2.1.7 tags (the old
# 2.1.7-fe-${arch} tags were renamed upstream and 2.1.7-be-x86_64 404s —
# T11 first-run finding F2). Docker auto-selects the host arch; no DORIS_ARCH
# is needed anymore.
# Doris BE needs vm.max_map_count>=2000000 on the docker host (Linux hosts:
# sysctl -w vm.max_map_count=2000000; OrbStack/Docker Desktop handle this).
# Image env contract verified against apache/doris master
# docker/runtime/docker-compose-demo (FE_SERVERS/FE_ID/BE_ADDR).
#
# Optional observability profile (roadmap T2, NOT part of the smoke stack):
#   docker compose --profile otel up -d
# adds an OTLP collector for a tailrace-node built with --features otel
# (spans over OTLP/HTTP). Point the node at it with
# OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.

# Host port overrides. The DEFAULTS are shifted off the standard Doris ports
# (8030/8040/9030) onto 38030/39030/38040: this is a shared dev machine that
# keeps another standing Doris on the standard ports (the mdop `doris-2.1`
# container, per the repo-group environment contract), and a bare
# `docker compose up -d` (the L3 gate's first leg, docs/dev/roadmap.md §三)
# must not collide with it. W3 gate 2026-10-17: `Bind for 0.0.0.0:8030
# failed: port is already allocated`. scripts/smoke.sh --full reads the same
# variables, so datasource wiring follows automatically. Further conflicts
# are still resolvable by exporting e.g. TAILRACE_FE_HTTP_PORT=48030
# TAILRACE_FE_MYSQL_PORT=49030 TAILRACE_BE_HTTP_PORT=48040 (the chaos
# testcontainers tests stay in 20000-34999, clear of all of these).

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: tailrace-kafka
    ports:
      - "127.0.0.1:${TAILRACE_KAFKA_PORT:-9092}:9094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # Dual listeners: PLAINTEXT serves in-container clients (healthcheck, smoke's
      # kafka-topics/producer execs on 127.0.0.1:9092) and advertises 9092; EXTERNAL
      # serves host clients and advertises the host-mapped port. A single listener
      # cannot do both — advertising the host port under TAILRACE_KAFKA_PORT breaks
      # in-container healthchecks (R3-W2 smoke 实证: kafka stuck "starting"), while
      # advertising 9092 redirects host clients to whatever else owns host 9092
      # (实证: engine consumed=0 against the wrong broker).
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,EXTERNAL://127.0.0.1:${TAILRACE_KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "tailR4ceSmokeKraft1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  doris-fe:
    image: apache/doris:fe-2.1.7
    container_name: tailrace-doris-fe
    # doris_be/fe refuse to start below 60000 open file descriptors (the
    # entrypoint warns and exits cleanly otherwise)
    ulimits:
      nofile:
        soft: 655350
        hard: 655350
    networks:
      doris_net:
        ipv4_address: 172.28.0.2
    ports:
      - "127.0.0.1:${TAILRACE_FE_HTTP_PORT:-38030}:8030"   # FE http
      - "127.0.0.1:${TAILRACE_FE_MYSQL_PORT:-39030}:9030"  # FE mysql protocol
    environment:
      # FE_SERVERS wants a literal IP (the image entrypoint regex rejects
      # hostnames) — static IPs on the dedicated doris_net, per the upstream
      # docker-compose-demo contract
      FE_SERVERS: "fe1:172.28.0.2:9010"
      FE_ID: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8030/api/bootstrap >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

  doris-be:
    image: apache/doris:be-2.1.7
    container_name: tailrace-doris-be
    ulimits:
      nofile:
        soft: 655350
        hard: 655350
    networks:
      doris_net:
        ipv4_address: 172.28.0.3
    depends_on:
      doris-fe:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TAILRACE_BE_HTTP_PORT:-38040}:8040"   # BE webserver (Stream Load target)
    environment:
      FE_SERVERS: "fe1:172.28.0.2:9010"
      BE_ADDR: "172.28.0.3:9050"
    healthcheck:
      # process liveness AND FE registration: the BE webserver answers
      # /api/health before the ALTER SYSTEM ADD BACKEND round completes,
      # and DDL/stream load against an unregistered BE fails with
      # "available backend num is 0" (T11 first-run finding F6) — `--wait`
      # must not report healthy for a half-formed cluster. The BE image
      # ships the mysql client (its own entrypoint uses it).
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8040/api/health >/dev/null && mysql -h172.28.0.2 -P9030 -uroot -N -e 'show backends' 2>/dev/null | grep -q 172.28.0.3"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

  # Optional OTLP sink for tailrace-node --features otel (profile "otel";
  # never started by smoke.sh or a plain `docker compose up -d`). Config is
  # inlined as a YAML provider string to keep this file self-contained: OTLP
  # over HTTP on 4318, debug exporter to the collector's own stdout.
  otel-collector:
    image: otel/opentelemetry-collector:0.163.1
    container_name: tailrace-otel-collector
    profiles: ["otel"]
    ports:
      - "127.0.0.1:4318:4318"   # OTLP http/protobuf (engine exporter target)
    command:
      - "--config=yaml:{receivers: {otlp: {protocols: {http: {endpoint: 0.0.0.0:4318}}}}, exporters: {debug: {verbosity: basic}}, service: {pipelines: {traces: {receivers: [otlp], exporters: [debug]}}}}"

  # Optional StarRocks allin1 for the T12 e2e (profile "starrocks"; never
  # started by smoke.sh or a plain `docker compose up -d`):
  #   docker compose --profile starrocks up -d --wait starrocks
  # starrocks/allin1-ubuntu runs FE + BE + an nginx "feproxy" under one
  # supervisor. Image internals (entrypoint.sh / feproxy.conf.template,
  # verified 2026-10-21): FE and BE both bind loopback with
  # priority_networks=127.0.0.1/32, and feproxy is the ONLY host-facing
  # HTTP entry — it listens on 8080, proxies to FE:8030, and INTERCEPTS the
  # FE→BE 307 redirect internally (error_page 307 = @handle_redirect re-posts
  # to the BE's Location). So stream_load_url for this stack is
  # http://127.0.0.1:48080/api/<db>/<table>/_stream_load and the engine's
  # client-side redirect following (StarRocks flavor, T12) is NOT exercised
  # here — that path is covered by the conn-doris mock contract tests; a
  # bare FE:8030 URL against a normal StarRocks deployment is what uses it.
  # DDL goes through the FE mysql protocol (9030, host side 49030).
  # Ports steer clear of the standing stack (8030/8040/9030 = mdop
  # doris-2.1, 38030/38040/39030 = this file's Doris defaults) — same
  # TAILRACE_* override pattern.
  starrocks:
    image: starrocks/allin1-ubuntu:latest
    container_name: tailrace-starrocks
    profiles: ["starrocks"]
    ports:
      - "127.0.0.1:${TAILRACE_SR_PROXY_PORT:-48080}:8080"   # feproxy (stream load entry)
      - "127.0.0.1:${TAILRACE_SR_FE_MYSQL_PORT:-49030}:9030" # FE mysql (DDL/queries)
    healthcheck:
      # the image's own health_check.sh contract: director's bootstrap done
      # (FE liveness + ALTER SYSTEM ADD BACKEND + heartbeat wait) AND both
      # http health endpoints — a half-formed cluster is not healthy
      # (same rationale as the doris-be healthcheck above)
      test: ["CMD-SHELL", "test -f $$SR_HOME/bootstrap_done && curl -sf http://127.0.0.1:8030/api/health >/dev/null && curl -sf http://127.0.0.1:8040/api/health >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 120
      start_period: 60s

networks:
  doris_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
